services:
  postgres:
    image: postgres:16-alpine
    container_name: f1pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: f1pulse
      POSTGRES_PASSWORD: f1pulse
      POSTGRES_DB: f1pulse
    ports:
      - "5432:5432"
    volumes:
      - f1pulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1pulse -d f1pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: f1pulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - f1pulse-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  f1pulse-pgdata:
  f1pulse-redisdata:
